<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>WorkWell</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#111;--paper:#fff;--muted:#f1f1ed;--line:#161616;--green:#16a34a;--green-dark:#087a34;--amber:#fbbf24;--red:#c62929;}
    *{box-sizing:border-box} body{margin:0;background:var(--paper);color:var(--ink);font:600 16px/1.45 Inter,system-ui,sans-serif}.app{max-width:720px;margin:0 auto;padding:0 18px 112px}.top{position:sticky;top:0;z-index:10;background:#fff;border-bottom:3px solid var(--line);margin:0 -18px;padding:18px 18px 14px}.brand{font:700 30px/1 Fraunces,serif;letter-spacing:-.04em}.sub{margin-top:6px;font-size:13px;color:#555}.toprow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.iconbtn{width:48px;height:48px;border:3px solid var(--line);border-radius:50%;background:#fff;font-size:22px;font-weight:800;cursor:pointer}.screen{padding-top:22px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.16em;color:#555}.card{border:3px solid var(--line);border-radius:25px;padding:20px;background:#fff;margin:0 0 18px}.card.dark{background:#111;color:#fff}.next{border:3px solid var(--line);border-radius:28px;padding:22px;background:var(--green);color:#fff;box-shadow:7px 7px 0 #111}.next .eyebrow{color:#e5ffe9}.title{font:700 29px/1.05 Fraunces,serif;letter-spacing:-.035em;margin:7px 0}.tasktitle{font:800 26px/1.15 Inter,sans-serif;margin:14px 0 4px}.small{font-size:14px;color:#555}.dark .small{color:#e4e4e4}.reason{border-top:2px solid rgba(255,255,255,.55);margin-top:16px;padding-top:14px;font-size:15px;line-height:1.5}.button{min-height:56px;border:3px solid var(--line);border-radius:999px;padding:10px 18px;background:#fff;color:#111;font:800 16px Inter,sans-serif;cursor:pointer}.button.primary{width:100%;background:#111;color:#fff;border-color:#111;margin-top:18px}.button.green{background:var(--green);color:#fff;border-color:#111}.button.subtle{background:#f2f2ef}.button.danger{background:#fff;color:var(--red);border-color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:18px 0 0}.metric{border:2px solid var(--line);border-radius:16px;padding:10px 9px;background:#fff;color:#111}.metric b{display:block;font-size:18px;line-height:1.1}.metric span{display:block;font-size:11px;margin-top:4px;color:#555}.status{margin:16px 0 0;padding:12px 14px;border:2px solid var(--line);border-radius:15px;background:#f3f3ef;font-size:14px;cursor:pointer}.timeline{display:grid;gap:8px;margin-top:15px}.time-row{display:grid;grid-template-columns:96px 1fr;gap:12px;font-size:15px}.time-row b{font-variant-numeric:tabular-nums}.summary{display:grid;grid-template-columns:1fr auto;gap:8px;padding:7px 0;border-bottom:1px solid #ccc;font-size:15px}.summary:last-child{border-bottom:0}.summary.total{font-weight:800;border-top:3px solid #111;border-bottom:0;margin-top:6px;padding-top:10px}.group{margin:20px 0}.grouphead{display:flex;justify-content:space-between;align-items:center;font-size:12px;letter-spacing:.14em;font-weight:800;margin-bottom:8px}.task{display:grid;grid-template-columns:42px 1fr auto 32px;align-items:center;gap:9px;border:2px solid var(--line);border-radius:16px;padding:8px 9px;margin:8px 0}.task.done{opacity:.52}.check{height:34px;width:34px;border:2px solid var(--line);border-radius:50%;background:#fff;font-weight:800;cursor:pointer}.task.done .check{background:var(--green);color:#fff}.taskname{font-weight:800;line-height:1.2}.taskmeta{font-size:12px;color:#555;margin-top:3px}.tasktime{font-size:13px;font-weight:800}.delete{border:0;background:transparent;font-size:23px;cursor:pointer;color:#555}.addbox{border:3px dashed var(--line);border-radius:20px;padding:14px;margin-top:18px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.input,.select{min-height:48px;border:2px solid var(--line);border-radius:13px;padding:8px 11px;font:700 15px Inter,sans-serif;background:#fff;min-width:0}.input.flex{flex:1}.addbox .select{flex:0 0 120px}.settings-section{padding:16px 0;border-bottom:2px solid #ddd}.settings-section:last-child{border:0}.settings-section h3{font-size:17px;margin:0 0 10px}.choices{display:flex;gap:8px;flex-wrap:wrap}.choice{min-height:45px;border:2px solid var(--line);border-radius:999px;padding:8px 14px;background:#fff;font:800 14px Inter,sans-serif;cursor:pointer}.choice.selected{background:#111;color:#fff}.choice.selected.green{background:var(--green);border-color:var(--green)}.recoverybox{border:3px solid var(--line);border-radius:22px;padding:18px;background:#effaf1;margin-top:18px}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end}.modal{width:min(720px,100%);margin:0 auto;background:#fff;border:3px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;padding:22px 18px 34px;max-height:90vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;gap:12px;align-items:start}.modal h2{font:700 28px/1 Fraunces,serif;margin:0}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:3px solid var(--line);z-index:20}.tabs{max-width:720px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tab{min-height:78px;border:0;border-right:2px solid var(--line);background:#fff;font:800 14px Inter,sans-serif;letter-spacing:.06em;cursor:pointer}.tab:last-child{border-right:0}.tab.active{background:#111;color:#fff}.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:60;background:#111;color:#fff;border-radius:999px;padding:11px 17px;font-size:14px;font-weight:800;max-width:90%;text-align:center}.notice{border-left:5px solid var(--amber);padding:10px 12px;background:#fff8dc;font-size:14px;margin-top:12px}.hidden{display:none}@media(max-width:470px){.metrics{grid-template-columns:1fr}.task{grid-template-columns:38px 1fr auto 28px}.tasktitle{font-size:23px}.brand{font-size:28px}.time-row{grid-template-columns:84px 1fr}.addbox .select{flex:1}.input.flex{flex-basis:100%}}
  </style>
</head>
<body>
<div id="root"></div>
<script>
(() => {
  const $ = (s, root=document) => root.querySelector(s);
  const esc = (s='') => String(s).replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
  const id = () => (crypto?.randomUUID?.() || `${Date.now()}-${Math.random()}`);
  const localDateTime = d => { const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };
  const tomorrowAt = (h,m=0) => { const d=new Date(); d.setDate(d.getDate()+1); d.setHours(h,m,0,0); return localDateTime(d); };
  const todayAt = (h,m=0) => { const d=new Date(); d.setHours(h,m,0,0); return localDateTime(d); };
  const defaultState = () => ({
    version: 3,
    settings: { desiredSleep:7.5, prepMinutes:35, commuteMinutes:25, commuteBufferMinutes:10, protectedBuffer:20 },
    shifts: [{ id:id(), start:tomorrowAt(6,30), end:tomorrowAt(15,0), location:'Main work site', overtimePossible:false }],
    tasks: [
      {id:id(),title:'Pack work bag',estimateMinutes:10,category:'must',dueBefore:'leave',done:false,plannedDate:new Date().toISOString().slice(0,10),rollovers:0},
      {id:id(),title:'Make lunch',estimateMinutes:10,category:'must',dueBefore:'leave',done:false,plannedDate:new Date().toISOString().slice(0,10),rollovers:0},
      {id:id(),title:'Lay out clothes',estimateMinutes:5,category:'useful',dueBefore:'',done:false,plannedDate:new Date().toISOString().slice(0,10),rollovers:0},
      {id:id(),title:'Watch an episode',estimateMinutes:42,category:'wait',dueBefore:'',done:false,plannedDate:new Date().toISOString().slice(0,10),rollovers:0}
    ],
    recovery:{energy:'okay',dayType:'normal',mealLogged:false},
    ui:{tab:'now', showSettings:false, showExplanation:false},
    history:[]
  });
  function load(){ try { const s=JSON.parse(localStorage.getItem('workwell_engine_v3')); return s && s.settings ? s : defaultState(); } catch(e){ return defaultState(); } }
  let state=load(), toastTimer;
  function save(){ localStorage.setItem('workwell_engine_v3', JSON.stringify(state)); }
  function shiftStart(s){ return new Date(s.start); }
  function shiftEnd(s){ return new Date(s.end); }
  function nextShift(now=new Date()) { return state.shifts.filter(s=>shiftStart(s)>now).sort((a,b)=>shiftStart(a)-shiftStart(b))[0] || null; }
  function addMinutes(d, mins){ const x=new Date(d); x.setMinutes(x.getMinutes()+mins); return x; }
  function plan(now=new Date()){
    const shift=nextShift(now); if(!shift) return {shift:null};
    const start=shiftStart(shift), end=shiftEnd(shift);
    const leave=addMinutes(start, -(state.settings.commuteMinutes + state.settings.commuteBufferMinutes));
    const wake=addMinutes(leave, -state.settings.prepMinutes);
    const bedtime=addMinutes(wake, -(state.settings.desiredSleep*60));
    const available=Math.max(0,Math.floor((bedtime-now)/60000));
    const active=state.tasks.filter(t=>!t.done);
    const mins=cat=>active.filter(t=>t.category===cat).reduce((a,t)=>a+Number(t.estimateMinutes||0),0);
    const must=mins('must'), useful=mins('useful'), wait=mins('wait');
    const planned=must+useful; const buffer=available-must;
    return {shift,start,end,leave,wake,bedtime,available,active,must,useful,wait,planned,buffer,required:must+state.settings.protectedBuffer};
  }
  function fmtTime(d){ return d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); }
  function fmtDate(d){ return d.toLocaleDateString([], {weekday:'long',month:'short',day:'numeric'}); }
  function duration(n){ n=Math.max(0,Math.round(n)); const h=Math.floor(n/60), m=n%60; return h ? (m?`${h}h ${m}m`:`${h}h`) : `${m}m`; }
  function taskSort(a,b){ const rank={must:0,useful:1,wait:2}; return rank[a.category]-rank[b.category] || Number(a.estimateMinutes)-Number(b.estimateMinutes); }
  function canDo(t,p){ if(t.category==='must') return true; if(state.recovery.energy==='drained') return false; const before=Math.max(0,p.available-p.must-state.settings.protectedBuffer); return t.category==='useful' ? Number(t.estimateMinutes)<=before : Number(t.estimateMinutes)<=Math.max(0,before-p.useful); }
  function recommendation(p){
    if(!p.shift) return {title:'Add your next shift',time:'1 minute',why:'WorkWell needs a real work start time before it can plan your leave, wake, and bedtime.',action:'Add shift',type:'setup'};
    if(p.available<=0) return {title:'Start winding down',time:'Now',why:'Your target bedtime has arrived. Protect tomorrow by stopping optional tasks.',action:'Begin wind-down',type:'winddown'};
    const mandatory=p.active.filter(t=>t.category==='must').sort(taskSort);
    const suitable=p.active.filter(t=>canDo(t,p)).sort(taskSort);
    const next=mandatory[0] || suitable[0];
    if(!next) return {title:'You are done for tonight',time:duration(p.available)+' left',why:'Your remaining tasks are optional or do not fit your protected sleep plan.',action:'Rest without extending bedtime',type:'rest'};
    let why=`It ${next.dueBefore==='leave'?'must be finished before you leave':'fits your plan'} and protects your ${next.dueBefore==='leave'?'morning':'sleep'} buffer.`;
    if(state.recovery.energy==='drained') why='You marked yourself as drained. Finish the essential task, then let optional chores wait.';
    if(p.buffer<state.settings.protectedBuffer && next.category!=='must') why='Time is tight tonight. This is the smallest useful task that still fits before your protected buffer.';
    return {title:next.title,time:duration(next.estimateMinutes),why,action:'Mark done',task:next,type:'task'};
  }
  function recoveryAdvice(p){
    const r=state.recovery;
    if(p.available<=45) return {title:'Light snack, then wind down',why:`Bedtime is in ${duration(p.available)}. Keep food simple and avoid adding optional chores tonight.`,button:'Log light snack'};
    if(r.dayType==='workout' || r.dayType==='active') return {title:'Eat a meal with carbohydrate + protein',why:'You had a physically demanding day. A simple meal now supports recovery before bedtime.',button:'Log meal'};
    if(r.energy==='drained') return {title:'Drink water and make tonight lighter',why:'Choose the essentials, a simple meal if needed, and an earlier wind-down.',button:'Log recovery'};
    if(r.dayType==='stress') return {title:'Choose a calm meal and lower stimulation',why:'A lower-pressure evening helps you recover from a high-stress day.',button:'Start wind-down'};
    return {title:'Eat normally, then protect bedtime',why:'Your schedule and energy do not require a special recovery plan tonight.',button:'Log meal'};
  }
  function rollover(){
    const p=plan(); const date=(p.shift?new Date(p.shift.start):new Date());
    state.tasks=state.tasks.map(t=>{
      if(!t.done && t.category!=='must' && !canDo(t,p) && t.plannedDate!==date.toISOString().slice(0,10)) return {...t,plannedDate:date.toISOString().slice(0,10),rollovers:(t.rollovers||0)+1};
      return t;
    }); save();
  }
  function toast(message){ clearTimeout(toastTimer); let el=$('.toast'); if(!el){el=document.createElement('div');el.className='toast';document.body.appendChild(el)} el.textContent=message; el.classList.remove('hidden'); toastTimer=setTimeout(()=>el.classList.add('hidden'),2800); }
  function haptic(){ try{navigator.vibrate?.(15)}catch(e){} }
  function render(){ rollover(); const p=plan(), rec=recommendation(p); document.querySelector('#root').innerHTML=`
    <div class="app">
      <header class="top"><div class="toprow"><div><div class="brand">WorkWell</div><div class="sub">Your calm work + recovery autopilot</div></div><button class="iconbtn" data-action="settings" aria-label="Settings">⚙</button></div></header>
      <main class="screen">${state.ui.tab==='now'?nowView(p,rec):state.ui.tab==='plan'?planView(p):recoveryView(p)}</main>
    </div>
    <nav class="bottom"><div class="tabs"><button class="tab ${state.ui.tab==='now'?'active':''}" data-tab="now">NOW</button><button class="tab ${state.ui.tab==='plan'?'active':''}" data-tab="plan">PLAN</button><button class="tab ${state.ui.tab==='recovery'?'active':''}" data-tab="recovery">RECOVERY</button></div></nav>
    ${state.ui.showSettings?settingsModal():''}
  `; bind(); }
  function nowView(p,rec){
    if(!p.shift) return `<div class="card"><div class="eyebrow">GET STARTED</div><h1 class="title">Set your next shift</h1><p>WorkWell uses your next shift to calculate when to leave, wake up, and start sleeping.</p><button class="button primary" data-action="settings">Set work time</button></div>`;
    const short=p.buffer<state.settings.protectedBuffer;
    return `<div class="eyebrow">${p.start>new Date()?fmtDate(p.start).toUpperCase():'TODAY'}</div>
      <section class="card"><div class="eyebrow">NEXT SHIFT</div><div class="title">${fmtTime(p.start)} work</div><div class="timeline"><div class="time-row"><b>${fmtTime(p.leave)}</b><span>Leave by</span></div><div class="time-row"><b>${fmtTime(p.wake)}</b><span>Wake by</span></div><div class="time-row"><b>${fmtTime(p.bedtime)}</b><span>Bedtime</span></div></div></section>
      <section class="next"><div class="eyebrow">NEXT STEP</div><div class="tasktitle">${esc(rec.title)}</div><div>${rec.time}</div><div class="reason"><b>Why this now:</b><br>${esc(rec.why)}</div><button class="button primary" data-action="complete-rec">${rec.action} ✓</button><div class="metrics"><div class="metric"><b>${duration(p.must)}</b><span>Essentials</span></div><div class="metric"><b>${duration(p.available)}</b><span>Time left</span></div><div class="metric"><b>${p.buffer>=0?duration(p.buffer):'0m'}</b><span>After essentials</span></div></div></section>
      <div class="status" data-action="explain">${short?'Tonight is tight — protect essentials and sleep.':'Essentials fit tonight. Optional tasks can wait.'} <b>⌄</b></div>
      ${state.ui.showExplanation?`<div class="notice">Your protected buffer is ${duration(state.settings.protectedBuffer)}. It is held back so the plan does not treat every free minute as available work.</div>`:''}`;
  }
  function planView(p){
    if(!p.shift) return `<div class="card"><h1 class="title">No next shift</h1><button class="button primary" data-action="settings">Add shift</button></div>`;
    const cats=[['must','MUST DO'],['useful','USEFUL'],['wait','CAN WAIT']];
    return `<div class="eyebrow">${fmtDate(p.start).toUpperCase()} PLAN</div><section class="card"><div class="timeline"><div class="time-row"><b>${fmtTime(p.start)}</b><span>Work starts</span></div><div class="time-row"><b>${fmtTime(p.leave)}</b><span>Leave by</span></div><div class="time-row"><b>${fmtTime(p.wake)}</b><span>Wake by</span></div><div class="time-row"><b>${fmtTime(p.bedtime)}</b><span>Bedtime</span></div></div></section>
    <section class="card"><div class="eyebrow">TONIGHT</div><div class="summary"><span>Must do</span><b>${duration(p.must)}</b></div><div class="summary"><span>Useful</span><b>${duration(p.useful)}</b></div><div class="summary"><span>Can wait</span><b>${duration(p.wait)}</b></div><div class="summary total"><span>Available</span><b>${duration(p.available)}</b></div><div class="summary"><span>Planned</span><b>${duration(p.planned)}</b></div><div class="summary"><span>Buffer</span><b>${p.buffer>=0?duration(p.buffer):'Over '+duration(-p.buffer)}</b></div>${p.buffer<state.settings.protectedBuffer?`<div class="notice">Only Must Do tasks are protected. Useful and Can Wait tasks may roll over automatically.</div>`:''}</section>
    <section class="card">${cats.map(([cat,label])=>taskGroup(cat,label,p)).join('')}<div class="addbox"><div class="eyebrow">QUICK ADD</div><div class="row" style="margin-top:9px"><input id="newTask" class="input flex" maxlength="70" placeholder="Task name"><input id="newMinutes" class="input" type="number" min="1" max="480" value="10" style="width:72px"><select id="newCategory" class="select"><option value="must">Must</option><option value="useful" selected>Useful</option><option value="wait">Can wait</option></select><button class="button green" data-action="add-task">Add</button></div></div></section>`;
  }
  function taskGroup(cat,label,p){ const tasks=state.tasks.filter(t=>t.category===cat).sort((a,b)=>Number(a.done)-Number(b.done)||taskSort(a,b)); const sum=tasks.filter(t=>!t.done).reduce((n,t)=>n+Number(t.estimateMinutes),0); return `<div class="group"><div class="grouphead"><span>${label}</span><span>${duration(sum)}</span></div>${tasks.length?tasks.map(t=>`<div class="task ${t.done?'done':''}"><button class="check" data-action="toggle-task" data-id="${t.id}">${t.done?'✓':''}</button><div><div class="taskname">${esc(t.title)}</div><div class="taskmeta">${t.dueBefore==='leave'?'Before leaving':''}${t.rollovers>=3?' • moved often':''}</div></div><div class="tasktime">${duration(t.estimateMinutes)}</div><button class="delete" title="Delete task" data-action="delete-task" data-id="${t.id}">×</button></div>`).join(''):`<div class="small">Nothing here.</div>`}</div>`; }
  function recoveryView(p){ const a=recoveryAdvice(p); return `<div class="eyebrow">RECOVERY</div><section class="card"><div class="title">How are you feeling?</div><div class="choices" style="margin-top:14px">${['good','okay','drained'].map(x=>`<button class="choice ${state.recovery.energy===x?'selected green':''}" data-action="energy" data-value="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="title" style="font-size:23px;margin-top:26px">Today was:</div><div class="choices" style="margin-top:14px">${[['normal','Normal'],['active','Active shift'],['workout','Workout'],['stress','High stress']].map(([v,l])=>`<button class="choice ${state.recovery.dayType===v?'selected':''}" data-action="daytype" data-value="${v}">${l}</button>`).join('')}</div></section><section class="recoverybox"><div class="eyebrow">NEXT RECOVERY STEP</div><div class="tasktitle" style="font-size:23px">${a.title}</div><p class="small" style="color:#222">${a.why}</p><button class="button primary" data-action="recovery-done">${a.button} ✓</button></section><section class="card"><div class="eyebrow">SLEEP PLAN</div><div class="title">${p.shift?'Bedtime: '+fmtTime(p.bedtime):'Add a shift first'}</div><p class="small">Recovery changes the recommendation, not the layout. WorkWell keeps the next decision small.</p></section>`; }
  function settingsModal(){ const s=state.settings, sh=nextShift() || state.shifts[0]; return `<div class="modalback"><section class="modal"><div class="modalhead"><div><div class="eyebrow">SETUP</div><h2>Schedule and planning</h2></div><button class="iconbtn" data-action="settings">×</button></div><div class="settings-section"><h3>Next shift</h3><div class="row"><label class="small">Starts<br><input id="shiftStart" class="input" type="datetime-local" value="${sh?sh.start:''}"></label><label class="small">Ends<br><input id="shiftEnd" class="input" type="datetime-local" value="${sh?sh.end:''}"></label></div><div class="row" style="margin-top:10px"><input id="shiftLocation" class="input flex" value="${esc(sh?.location||'')}" placeholder="Work location"><button class="button green" data-action="save-shift">Save shift</button></div><p class="small">Use real date and time values. Overnight shifts work as long as the end date-time is after the start.</p></div><div class="settings-section"><h3>Leave and sleep plan</h3><div class="row"><label class="small">Prep minutes<br><input id="prep" class="input" type="number" min="0" max="240" value="${s.prepMinutes}"></label><label class="small">Commute minutes<br><input id="commute" class="input" type="number" min="0" max="300" value="${s.commuteMinutes}"></label><label class="small">Commute buffer<br><input id="commuteBuffer" class="input" type="number" min="0" max="120" value="${s.commuteBufferMinutes}"></label><label class="small">Sleep hours<br><input id="sleep" class="input" type="number" min="4" max="12" step="0.5" value="${s.desiredSleep}"></label><label class="small">Protected buffer<br><input id="protected" class="input" type="number" min="0" max="120" value="${s.protectedBuffer}"></label></div><button class="button primary" data-action="save-settings">Save planning settings</button></div><div class="settings-section"><h3>Data</h3><div class="row"><button class="button subtle" data-action="export">Export backup</button><button class="button subtle" data-action="import">Import backup</button><button class="button danger" data-action="reset">Reset app</button><input id="importFile" type="file" accept="application/json" class="hidden"></div></div></section></div>`; }
  function bind(){
    document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{state.ui.tab=b.dataset.tab;save();render()});
    document.querySelectorAll('[data-action]').forEach(el=>el.onclick=(e)=>handle(e.currentTarget));
  }
  function handle(el){ const a=el.dataset.action, p=plan();
    if(a==='settings'){state.ui.showSettings=!state.ui.showSettings;save();render();return}
    if(a==='explain'){state.ui.showExplanation=!state.ui.showExplanation;save();render();return}
    if(a==='complete-rec'){ const r=recommendation(p); if(r.type==='task'){ completeTask(r.task.id); } else if(r.type==='setup'){state.ui.showSettings=true;render()} else {toast(r.action+' — good call.');haptic()} return; }
    if(a==='toggle-task'){completeTask(el.dataset.id);return}
    if(a==='delete-task'){state.tasks=state.tasks.filter(t=>t.id!==el.dataset.id);save();render();toast('Task removed');return}
    if(a==='add-task'){const title=$('#newTask').value.trim(), mins=Number($('#newMinutes').value), category=$('#newCategory').value;if(!title||!mins){toast('Add a task name and minutes.');return}state.tasks.push({id:id(),title,estimateMinutes:Math.max(1,mins),category,dueBefore:category==='must'?'leave':'',done:false,plannedDate:new Date().toISOString().slice(0,10),rollovers:0});save();render();toast('Added to '+(category==='must'?'Must Do':category==='useful'?'Useful':'Can Wait'));return}
    if(a==='energy'){state.recovery.energy=el.dataset.value;save();render();return}
    if(a==='daytype'){state.recovery.dayType=el.dataset.value;save();render();return}
    if(a==='recovery-done'){state.recovery.mealLogged=true;save();toast('Recovery step logged');haptic();return}
    if(a==='save-shift'){const start=$('#shiftStart').value,end=$('#shiftEnd').value,location=$('#shiftLocation').value.trim()||'Work location';if(!start||!end||new Date(end)<=new Date(start)){toast('Shift end must be after shift start.');return}const current=nextShift()||state.shifts[0]; if(current){Object.assign(current,{start,end,location})}else{state.shifts.push({id:id(),start,end,location,overtimePossible:false})}save();render();toast('Next shift saved');return}
    if(a==='save-settings'){const n=id=>Number($(id).value);const vals={prepMinutes:n('#prep'),commuteMinutes:n('#commute'),commuteBufferMinutes:n('#commuteBuffer'),desiredSleep:n('#sleep'),protectedBuffer:n('#protected')};if(Object.values(vals).some(x=>Number.isNaN(x)||x<0)){toast('Use valid planning numbers.');return}state.settings=vals;save();render();toast('Planning settings saved');return}
    if(a==='export'){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),x=document.createElement('a');x.href=url;x.download='workwell-backup.json';x.click();URL.revokeObjectURL(url);return}
    if(a==='import'){$('#importFile').click();$('#importFile').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const imported=JSON.parse(r.result);if(!imported.settings||!Array.isArray(imported.shifts)||!Array.isArray(imported.tasks))throw Error();state=imported;save();render();toast('Backup restored')}catch(err){toast('That backup file is not valid.')}};r.readAsText(f)};return}
    if(a==='reset'){if(confirm('Reset WorkWell and erase this browser data?')){state=defaultState();save();render();toast('WorkWell reset')}return}
  }
  function completeTask(taskId){const t=state.tasks.find(x=>x.id===taskId);if(!t)return;const now=Date.now();if(!t.done){const actual=Math.max(1,Math.round((now-(t.startedAt||now))/60000));t.done=true;t.completedAt=new Date().toISOString();state.history.push({taskId:t.id,title:t.title,estimate:t.estimateMinutes,actual,at:t.completedAt});if(t.actualSamples?.length){t.actualSamples.push(actual)}else{t.actualSamples=[actual]}if(t.actualSamples.length>=3){const avg=t.actualSamples.slice(-6).reduce((a,b)=>a+b,0)/Math.min(6,t.actualSamples.length);t.estimateMinutes=Math.max(1,Math.round(t.estimateMinutes*.75+avg*.25));}}else{t.done=false;t.completedAt=null}save();render();toast(t.done?`${t.title} done`:`${t.title} reopened`);haptic();}
  render();
})();
</script>
</body>
</html>
