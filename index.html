<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>WorkWell</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#111;--paper:#fff;--soft:#f4f4ef;--line:#111;--green:#148b41;--green2:#0b6630;--amber:#fff2c7;--red:#a82222;--blue:#edf7ff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:600 17px/1.48 Inter,Arial,sans-serif}.app{max-width:740px;margin:auto;padding:0 18px 116px}.top{position:sticky;top:0;background:#fff;z-index:10;margin:0 -18px;padding:17px 18px 14px;border-bottom:4px solid var(--line)}.toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.brand{font:700 32px/1 Fraunces,serif;letter-spacing:-.04em}.sub{font-size:14px;color:#555;margin-top:6px}.iconbtn{height:52px;width:52px;border:3px solid var(--line);border-radius:50%;background:#fff;font-size:23px;font-weight:800;cursor:pointer}.screen{padding-top:21px}.eyebrow{font-size:13px;font-weight:800;letter-spacing:.13em;color:#565656}.title{font:700 29px/1.1 Fraunces,serif;letter-spacing:-.035em;margin:6px 0 10px}.card{border:3px solid var(--line);border-radius:25px;padding:20px;margin:0 0 18px;background:#fff}.card.soft{background:var(--soft)}.next{border:3px solid var(--line);border-radius:27px;padding:21px;background:var(--green);color:#fff;box-shadow:7px 7px 0 var(--line)}.next .eyebrow{color:#edfff2}.tasktitle{font:800 27px/1.15 Inter,sans-serif;margin:14px 0 4px}.reason{margin-top:16px;border-top:2px solid rgba(255,255,255,.58);padding-top:14px;font-size:16px}.button{min-height:58px;border:3px solid var(--line);border-radius:999px;padding:10px 18px;background:#fff;color:#111;font:800 17px Inter,sans-serif;cursor:pointer}.button.primary{width:100%;margin-top:18px;background:#111;color:#fff}.button.green{background:var(--green);color:#fff}.button.soft{background:var(--soft)}.button.warn{color:var(--red);border-color:var(--red)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.metric{color:#111;background:#fff;border:2px solid #111;border-radius:16px;padding:10px}.metric b{font-size:19px;display:block;line-height:1.15}.metric span{font-size:12px;color:#505050;display:block;margin-top:3px}.status{padding:13px 15px;background:#f3f3ee;border:2px solid var(--line);border-radius:16px;font-size:15px;cursor:pointer}.notice{border-left:6px solid #d69700;background:var(--amber);padding:12px 14px;margin-top:13px;font-size:15px}.info{border-left:6px solid #2079ab;background:var(--blue);padding:12px 14px;margin-top:13px;font-size:15px}.timeline{display:grid;gap:9px;margin-top:14px}.time-row{display:grid;grid-template-columns:104px 1fr;gap:12px}.time-row b{font-variant-numeric:tabular-nums}.summary{display:grid;grid-template-columns:1fr auto;padding:8px 0;border-bottom:1px solid #c7c7c2;font-size:16px}.summary.total{font-weight:800;border-top:3px solid #111;border-bottom:0;margin-top:7px;padding-top:11px}.group{margin:21px 0}.grouphead{display:flex;justify-content:space-between;font-size:13px;letter-spacing:.12em;font-weight:800;margin-bottom:8px}.task{display:grid;grid-template-columns:42px 1fr auto 31px;gap:9px;align-items:center;border:2px solid var(--line);border-radius:17px;padding:9px;margin:8px 0}.task.done{opacity:.52}.check{height:35px;width:35px;border:2px solid #111;border-radius:50%;background:#fff;font-size:18px;font-weight:800;cursor:pointer}.task.done .check{background:var(--green);color:#fff}.taskname{font-weight:800;line-height:1.2}.taskmeta{font-size:12px;color:#555;margin-top:3px}.tasktime{font-size:14px;font-weight:800}.delete{border:0;background:transparent;font-size:24px;cursor:pointer;color:#555}.addbox{border:3px dashed #111;border-radius:20px;padding:15px;margin-top:17px}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.input,.select{min-height:50px;border:2px solid #111;border-radius:13px;padding:8px 11px;font:700 16px Inter,sans-serif;background:#fff;min-width:0}.input.flex{flex:1}.select{max-width:160px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}.choice{min-height:46px;border:2px solid #111;border-radius:999px;padding:8px 14px;background:#fff;font:800 15px Inter,sans-serif;cursor:pointer}.choice.selected{background:#111;color:#fff}.choice.selected.green{background:var(--green);border-color:var(--green)}.food-card{border:3px solid #111;border-radius:23px;padding:18px;background:#effaf1;margin:17px 0}.food-card h2{font:800 23px/1.18 Inter,sans-serif;margin:8px 0}.food-list{margin:13px 0 0;padding:0;list-style:none}.food-list li{padding:9px 0;border-bottom:1px solid #b5d5bd}.food-list li:last-child{border-bottom:0}.small{font-size:14px;color:#4f4f4f}.modalback{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:40;display:flex;align-items:flex-end}.modal{width:min(740px,100%);margin:auto;background:#fff;border:3px solid #111;border-bottom:0;border-radius:28px 28px 0 0;padding:21px 18px 34px;max-height:92vh;overflow:auto}.modalhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.modal h2{font:700 29px/1 Fraunces,serif;margin:0}.setting{padding:17px 0;border-bottom:2px solid #ddd}.setting:last-child{border-bottom:0}.setting h3{margin:0 0 10px;font-size:18px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:4px solid #111;z-index:20}.tabs{max-width:740px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr)}.tab{min-height:80px;border:0;border-right:2px solid #111;background:#fff;font:800 14px Inter,sans-serif;letter-spacing:.06em;cursor:pointer}.tab:last-child{border:0}.tab.active{background:#111;color:#fff}.toast{position:fixed;left:50%;bottom:97px;transform:translateX(-50%);z-index:60;background:#111;color:#fff;border-radius:999px;padding:11px 17px;font-size:15px;font-weight:800;max-width:92%;text-align:center}.hidden{display:none}@media(max-width:490px){.metrics{grid-template-columns:1fr}.task{grid-template-columns:39px 1fr auto 27px}.time-row{grid-template-columns:91px 1fr}.brand{font-size:29px}.tasktitle{font-size:24px}.input.flex{flex-basis:100%}.select{flex:1;max-width:none}.button.green{flex:1}.row .input:not(.flex){width:76px}}
</style></head><body><div id="root"></div>
<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s);const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const uid=()=>crypto?.randomUUID?.()||`${Date.now()}-${Math.random()}`;const pad=n=>String(n).padStart(2,'0');
const ldt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;const tomorrow=(h,m=0)=>{let d=new Date();d.setDate(d.getDate()+1);d.setHours(h,m,0,0);return ldt(d)};
const defaults=()=>({version:4,settings:{desiredSleep:7.5,prep:35,commute:25,commuteBuffer:10,protectedBuffer:20},shifts:[{id:uid(),start:tomorrow(6,30),end:tomorrow(15),location:'Main work site'}],tasks:[{id:uid(),title:'Pack work bag',estimate:10,category:'must',beforeLeave:true,done:false},{id:uid(),title:'Make lunch',estimate:10,category:'must',beforeLeave:true,done:false},{id:uid(),title:'Lay out clothes',estimate:5,category:'useful',beforeLeave:false,done:false},{id:uid(),title:'Watch an episode',estimate:42,category:'wait',beforeLeave:false,done:false}],recovery:{energy:'okay',dayType:'normal',foodAccess:'standard',needs:{vegetables:false,fruit:false,protein:false,fiber:false,omega3:false,probiotic:false}},ui:{tab:'now',settings:false,explain:false,foodDetail:false},history:[]});
let state;try{state=JSON.parse(localStorage.getItem('workwell_v4'))||defaults()}catch{state=defaults()}if(!state.settings||!state.shifts||!state.tasks)state=defaults();const save=()=>localStorage.setItem('workwell_v4',JSON.stringify(state));
const mins=(d,n)=>{let x=new Date(d);x.setMinutes(x.getMinutes()+n);return x};const time=d=>new Date(d).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});const date=d=>new Date(d).toLocaleDateString([],{weekday:'long',month:'short',day:'numeric'});const dur=n=>{n=Math.max(0,Math.round(n));let h=Math.floor(n/60),m=n%60;return h?(m?`${h}h ${m}m`:`${h}h`):`${m}m`};
function nextShift(now=new Date()){return state.shifts.filter(s=>new Date(s.start)>now).sort((a,b)=>new Date(a.start)-new Date(b.start))[0]||null}function plan(now=new Date()){let shift=nextShift(now);if(!shift)return{shift:null};let start=new Date(shift.start),leave=mins(start,-(Number(state.settings.commute)+Number(state.settings.commuteBuffer))),wake=mins(leave,-Number(state.settings.prep)),bed=mins(wake,-Number(state.settings.desiredSleep)*60),available=Math.max(0,Math.floor((bed-now)/60000)),active=state.tasks.filter(t=>!t.done),sum=c=>active.filter(t=>t.category===c).reduce((a,t)=>a+Number(t.estimate),0),must=sum('must'),useful=sum('useful'),wait=sum('wait');return{shift,start,leave,wake,bed,available,active,must,useful,wait,planned:must+useful,buffer:available-must}}
const rank={must:0,useful:1,wait:2};function suitable(t,p){if(t.category==='must')return true;if(state.recovery.energy==='drained')return false;let capacity=Math.max(0,p.available-p.must-state.settings.protectedBuffer);return t.category==='useful'?Number(t.estimate)<=capacity:Number(t.estimate)<=Math.max(0,capacity-p.useful)}
function rec(p){if(!p.shift)return{title:'Set your next work time',time:'1 minute',why:'WorkWell needs a shift time to calculate leaving, waking, and bedtime.',action:'Set work time',kind:'setup'};if(p.available<=0)return{title:'Start winding down',time:'Now',why:'Your target bedtime has arrived. Skip optional tasks and protect tomorrow.',action:'Begin wind-down',kind:'wind'};let ts=p.active.filter(t=>t.category==='must').sort((a,b)=>a.estimate-b.estimate)||[];let t=ts[0]||p.active.filter(t=>suitable(t,p)).sort((a,b)=>rank[a.category]-rank[b.category]||a.estimate-b.estimate)[0];if(!t)return{title:'You are done for tonight',time:dur(p.available)+' left',why:'Everything left is optional or does not fit the protected plan.',action:'Rest without extending bedtime',kind:'rest'};let why=t.beforeLeave?'It needs to be done before you leave and protects your morning buffer.':'It is the smallest useful task that fits without taking sleep time.';if(state.recovery.energy==='drained')why='You said you feel drained. Finish this essential task, then let optional chores wait.';return{title:t.title,time:dur(t.estimate),why,action:'Mark done',task:t,kind:'task'}}
function food(p){let n=state.recovery.needs,a=state.recovery.foodAccess,near=p.available<=45,active=state.recovery.dayType==='active'||state.recovery.dayType==='workout';let base=[];if(near){base=['Plain yogurt or kefir + banana + walnuts','Oatmeal with milk or fortified soy milk + berries','Whole-grain toast + peanut butter + fruit'];return{title:'Light food, then wind down',why:`Bedtime is in ${dur(p.available)}. Choose a modest, familiar option rather than a large, heavy meal.`,base,upgrade:'If available, add berries or a kiwi for fruit and fiber.'}}if(active){base=['Salmon or sardines + brown rice + spinach','Beans or lentils + rice + peppers + olive oil','Chicken or tofu + sweet potato + broccoli'];}else if(state.recovery.energy==='drained'){base=['Eggs + whole-grain toast + fruit','Greek yogurt + oats + berries + nuts','Bean soup + whole-grain bread + fruit'];}else{base=['Beans or lentils + rice + vegetables','Chicken or tofu + whole grain + vegetables','Eggs + whole-grain toast + fruit'];}let upgrades=[];if(!n.vegetables)upgrades.push('Add a colorful vegetable: spinach, broccoli, peppers, carrots, or frozen mixed vegetables.');if(!n.fruit)upgrades.push('Add fruit: berries, orange, banana, apple, or kiwi.');if(!n.protein)upgrades.push('Add a protein food: beans, lentils, eggs, yogurt, fish, chicken, tofu, or fortified soy food.');if(!n.fiber)upgrades.push('Choose oats, beans, lentils, whole-grain bread, brown rice, fruit, or vegetables.');if(!n.omega3)upgrades.push('For omega-3 food: choose salmon, sardines, trout, chia, flax, or walnuts.');if(!n.probiotic)upgrades.push('For probiotic food: choose plain yogurt, kefir, or a fermented food you tolerate.');if(a==='limited')upgrades.push('Low-access option: canned beans or fish, frozen vegetables, oats, peanut butter, plain yogurt, and fruit can build a simple meal.');if(a==='none')upgrades.push('No food available: drink water if safe for you and make the next meal simple; do not use the app as a substitute for food or medical care.');return{title:active?'Recovery meal: carbohydrate + protein':'Simple balanced meal',why:'Food first: use familiar whole or minimally processed foods. These combinations support energy, fiber, protein, and commonly overlooked nutrients without turning the app into a supplement plan.',base,upgrade:upgrades[0]||'You have checked the main food groups. Keep the meal simple and satisfying.',more:upgrades.slice(1)}}
let timer;function toast(s){clearTimeout(timer);let e=$('.toast');if(!e){e=document.createElement('div');e.className='toast';document.body.append(e)}e.textContent=s;e.classList.remove('hidden');timer=setTimeout(()=>e.classList.add('hidden'),2600)}function buzz(){try{navigator.vibrate?.(16)}catch{}}
function render(){let p=plan(),r=rec(p);$('#root').innerHTML=`<div class="app"><header class="top"><div class="toprow"><div><div class="brand">WorkWell</div><div class="sub">Simple work, recovery, and food planning</div></div><button class="iconbtn" data-a="settings" aria-label="Settings">⚙</button></div></header><main class="screen">${state.ui.tab==='now'?now(p,r):state.ui.tab==='plan'?planView(p):recovery(p)}</main></div><nav class="bottom"><div class="tabs"><button class="tab ${state.ui.tab==='now'?'active':''}" data-tab="now">NOW</button><button class="tab ${state.ui.tab==='plan'?'active':''}" data-tab="plan">PLAN</button><button class="tab ${state.ui.tab==='recovery'?'active':''}" data-tab="recovery">FOOD + RECOVERY</button></div></nav>${state.ui.settings?settings():''}`;bind()}
function now(p,r){if(!p.shift)return`<section class="card"><div class="eyebrow">START HERE</div><h1 class="title">Set your next work time</h1><p>Use the large Work Time button. There is no small calendar to navigate.</p><button class="button green" data-a="settings">SET WORK TIME</button></section>`;let tv=p.active.find(t=>/watch|episode|tv|show/i.test(t.title));return`<div class="eyebrow">${date(p.start).toUpperCase()}</div><section class="card"><div class="eyebrow">NEXT SHIFT</div><div class="title">${time(p.start)} work</div><div class="timeline"><div class="time-row"><b>${time(p.leave)}</b><span>Leave by</span></div><div class="time-row"><b>${time(p.wake)}</b><span>Wake by</span></div><div class="time-row"><b>${time(p.bed)}</b><span>Bedtime</span></div></div></section><section class="next"><div class="eyebrow">#1 PRIORITY</div><div class="tasktitle">${esc(r.title)}</div><div>${r.time}</div><div class="reason"><b>Why this now:</b><br>${esc(r.why)}</div><button class="button primary" data-a="complete">${r.action} ✓</button><div class="metrics"><div class="metric"><b>${dur(p.must)}</b><span>Must do</span></div><div class="metric"><b>${dur(p.available)}</b><span>Time left</span></div><div class="metric"><b>${p.buffer>=0?dur(p.buffer):'0m'}</b><span>After essentials</span></div></div></section><div class="status" data-a="explain">${p.buffer<state.settings.protectedBuffer?'Tonight is tight. Essentials first.':'Essentials fit tonight. Optional tasks can wait.'} <b>⌄</b></div>${state.ui.explain?`<div class="notice">WorkWell reserves ${dur(state.settings.protectedBuffer)} as protected buffer. It does not assume every free minute should be used.</div>`:''}${tv?`<section class="card soft" style="margin-top:18px"><div class="eyebrow">TV OR TOMORROW?</div><div class="title" style="font-size:24px">${esc(tv.title)} — ${dur(tv.estimate)}</div><p class="small">If you do it tonight, time after essentials becomes ${dur(Math.max(0,p.buffer-tv.estimate))}. ${p.buffer-tv.estimate<state.settings.protectedBuffer?'That cuts into your protected buffer. Save it for tomorrow.':'It still fits, if you stop at bedtime.'}</p><button class="button soft" data-a="move-tv" data-id="${tv.id}">MOVE TO TOMORROW</button></section>`:''}`}
function planView(p){if(!p.shift)return`<section class="card"><h1 class="title">No shift saved</h1><button class="button green" data-a="settings">SET WORK TIME</button></section>`;let cats=[['must','MUST DO'],['useful','USEFUL'],['wait','CAN WAIT']];return`<div class="eyebrow">${date(p.start).toUpperCase()} PLAN</div><section class="card"><div class="timeline"><div class="time-row"><b>${time(p.start)}</b><span>Work starts</span></div><div class="time-row"><b>${time(p.leave)}</b><span>Leave by</span></div><div class="time-row"><b>${time(p.wake)}</b><span>Wake by</span></div><div class="time-row"><b>${time(p.bed)}</b><span>Bedtime</span></div></div><button class="button green" style="margin-top:18px;width:100%" data-a="settings">CHANGE WORK TIME</button></section><section class="card"><div class="eyebrow">TONIGHT</div><div class="summary"><span>Must do</span><b>${dur(p.must)}</b></div><div class="summary"><span>Useful</span><b>${dur(p.useful)}</b></div><div class="summary"><span>Can wait</span><b>${dur(p.wait)}</b></div><div class="summary total"><span>Available</span><b>${dur(p.available)}</b></div><div class="summary"><span>Planned</span><b>${dur(p.planned)}</b></div><div class="summary"><span>Buffer</span><b>${p.buffer>=0?dur(p.buffer):'Over '+dur(-p.buffer)}</b></div></section><section class="card">${cats.map(([c,l])=>group(c,l)).join('')}<div class="addbox"><div class="eyebrow">ADD ONE TASK</div><div class="row" style="margin-top:9px"><input id="taskname" class="input flex" placeholder="What needs doing?"><input id="taskmins" class="input" type="number" min="1" max="480" value="10" style="width:78px"><select id="taskcat" class="select"><option value="must">Must do</option><option value="useful" selected>Useful</option><option value="wait">Can wait</option></select><button class="button green" data-a="add">ADD</button></div></div></section><section class="card soft"><div class="eyebrow">QUIET HOURS MESSAGE</div><p id="quietText">Please be quiet from ${time(p.bed)} to ${time(p.wake)}. I need sleep before work. Headphones please. Text instead of calling. Thank you.</p><button class="button soft" data-a="copy-quiet">COPY MESSAGE</button></section>`}
function group(c,label){let ts=state.tasks.filter(t=>t.category===c).sort((a,b)=>Number(a.done)-Number(b.done)||a.estimate-b.estimate),sum=ts.filter(t=>!t.done).reduce((a,t)=>a+Number(t.estimate),0);return`<div class="group"><div class="grouphead"><span>${label}</span><span>${dur(sum)}</span></div>${ts.length?ts.map(t=>`<div class="task ${t.done?'done':''}"><button class="check" data-a="toggle" data-id="${t.id}">${t.done?'✓':''}</button><div><div class="taskname">${esc(t.title)}</div><div class="taskmeta">${t.beforeLeave?'Before leaving':''}${t.rollovers>=3?' • moved often':''}</div></div><div class="tasktime">${dur(t.estimate)}</div><button class="delete" data-a="delete" data-id="${t.id}">×</button></div>`).join(''):`<div class="small">Nothing here.</div>`}</div>`}
function recovery(p){let f=food(p),n=state.recovery.needs;return`<div class="eyebrow">FOOD + RECOVERY</div><section class="card"><div class="title">How are you feeling?</div><div class="chips">${['good','okay','drained'].map(x=>`<button class="choice ${state.recovery.energy===x?'selected green':''}" data-a="energy" data-v="${x}">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div><div class="title" style="font-size:23px;margin-top:25px">Today was:</div><div class="chips">${[['normal','Normal'],['active','Active shift'],['workout','Workout'],['stress','High stress']].map(([v,l])=>`<button class="choice ${state.recovery.dayType===v?'selected':''}" data-a="day" data-v="${v}">${l}</button>`).join('')}</div></section><section class="food-card"><div class="eyebrow">FOOD-FIRST SUGGESTION</div><h2>${f.title}</h2><p class="small" style="color:#222">${f.why}</p><ul class="food-list">${f.base.map(x=>`<li><b>${x}</b></li>`).join('')}</ul><div class="info"><b>Best upgrade:</b> ${f.upgrade}</div>${state.ui.foodDetail&&f.more?.length?`<div class="notice"><b>Other useful upgrades:</b><br>${f.more.map(x=>'• '+x).join('<br>')}</div>`:''}<div class="row" style="margin-top:15px"><button class="button green" data-a="food-done">LOG FOOD</button><button class="button soft" data-a="food-detail">${state.ui.foodDetail?'HIDE DETAILS':'SHOW FOOD NEEDS'}</button></div></section><section class="card"><div class="eyebrow">FOOD NEEDS TODAY</div><p class="small">Tap only what you have not eaten. This is a simple food reminder, not a medical diagnosis or vitamin prescription.</p><div class="chips">${[['vegetables','Vegetables'],['fruit','Fruit'],['protein','Protein'],['fiber','Fiber'],['omega3','Omega-3 food'],['probiotic','Probiotic food']].map(([k,l])=>`<button class="choice ${n[k]?'selected green':''}" data-a="need" data-v="${k}">${n[k]?'Need ':''}${l}</button>`).join('')}</div><div class="title" style="font-size:22px;margin-top:22px">Food access</div><div class="chips">${[['standard','Usual groceries'],['limited','Limited groceries'],['none','No food right now']].map(([v,l])=>`<button class="choice ${state.recovery.foodAccess===v?'selected':''}" data-a="access" data-v="${v}">${l}</button>`).join('')}</div></section><section class="card soft"><div class="eyebrow">CREDIBILITY NOTE</div><p class="small">Suggestions emphasize foods that can contribute protein, fiber, omega-3 fats, probiotics, and micronutrients. They do not diagnose deficiencies, calculate a personalized calorie target, or replace advice for kidney, heart, digestive, eating-disorder, allergy, pregnancy, medication, or other medical needs. For those situations, follow your clinician or dietitian’s plan.</p></section>`}
function settings(){let sh=nextShift()||state.shifts[0],s=state.settings;return`<div class="modalback"><section class="modal"><div class="modalhead"><div><div class="eyebrow">SETTINGS</div><h2>Planning details</h2></div><button class="iconbtn" data-a="settings">×</button></div><div class="setting"><h3>Timing</h3><p class="small">Work time is changed from the large button on Plan. These are supporting planning settings.</p><div class="row"><label class="small">Getting ready<br><input id="prep" class="input" type="number" value="${s.prep}" min="0" max="240"></label><label class="small">Commute<br><input id="commute" class="input" type="number" value="${s.commute}" min="0" max="300"></label><label class="small">Commute buffer<br><input id="cb" class="input" type="number" value="${s.commuteBuffer}" min="0" max="120"></label><label class="small">Sleep hours<br><input id="sleep" class="input" type="number" step=".5" value="${s.desiredSleep}" min="4" max="12"></label><label class="small">Protected buffer<br><input id="pb" class="input" type="number" value="${s.protectedBuffer}" min="0" max="180"></label></div><button class="button primary" data-a="save-settings">SAVE SETTINGS</button></div><div class="setting"><h3>Backup</h3><div class="row"><button class="button soft" data-a="export">EXPORT</button><button class="button soft" data-a="import">IMPORT</button><button class="button warn" data-a="reset">RESET</button><input id="file" type="file" accept="application/json" class="hidden"></div></div></section></div>`}
function shiftPicker(){let p=plan(),sh=nextShift()||state.shifts[0];return`<div class="modalback"><section class="modal"><div class="modalhead"><div><div class="eyebrow">WORK TIME</div><h2>Set next shift</h2></div><button class="iconbtn" data-a="close-shift">×</button></div><p class="small">Large date and time controls. No calendar grid is required.</p><div class="setting"><label class="small">Work date<br><input id="workdate" class="input" type="date" value="${sh.start.slice(0,10)}"></label><div class="row" style="margin-top:13px"><button class="choice" data-a="quick-start" data-v="06:00">6:00 AM</button><button class="choice" data-a="quick-start" data-v="06:30">6:30 AM</button><button class="choice" data-a="quick-start" data-v="07:00">7:00 AM</button><button class="choice" data-a="quick-start" data-v="14:00">2:00 PM</button><button class="choice" data-a="quick-start" data-v="22:00">10:00 PM</button></div><div class="row" style="margin-top:13px"><label class="small">Starts<br><input id="starttime" class="input" type="time" value="${sh.start.slice(11,16)}"></label><label class="small">Ends<br><input id="endtime" class="input" type="time" value="${sh.end.slice(11,16)}"></label></div><label class="small" style="display:block;margin-top:13px">Work location<br><input id="location" class="input" style="width:100%" value="${esc(sh.location||'')}"></label><div class="notice">For an overnight shift, choose the same start date; WorkWell automatically places an earlier end time on the next day.</div><button class="button primary" data-a="save-shift">SAVE WORK TIME</button></div></section></div>`}
function bind(){document.querySelectorAll('[data-tab]').forEach(e=>e.onclick=()=>{state.ui.tab=e.dataset.tab;save();render()});document.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>act(e));}
function act(e){let a=e.dataset.a,p=plan();if(a==='settings'){state.ui.settings=!state.ui.settings;save();render();return}if(a==='close-shift'){render();return}if(a==='explain'){state.ui.explain=!state.ui.explain;save();render();return}if(a==='complete'){let r=rec(p);if(r.kind==='task')toggle(r.task.id);else if(r.kind==='setup')openShift();else{toast(r.action);buzz()}return}if(a==='toggle'){toggle(e.dataset.id);return}if(a==='delete'){state.tasks=state.tasks.filter(t=>t.id!==e.dataset.id);save();render();return}if(a==='add'){let title=$('#taskname').value.trim(),estimate=Number($('#taskmins').value),category=$('#taskcat').value;if(!title||!estimate){toast('Enter a task and minutes.');return}state.tasks.push({id:uid(),title,estimate,category,beforeLeave:category==='must',done:false});save();render();toast('Task added');return}if(a==='energy'){state.recovery.energy=e.dataset.v;save();render();return}if(a==='day'){state.recovery.dayType=e.dataset.v;save();render();return}if(a==='need'){let k=e.dataset.v;state.recovery.needs[k]=!state.recovery.needs[k];save();render();return}if(a==='access'){state.recovery.foodAccess=e.dataset.v;save();render();return}if(a==='food-detail'){state.ui.foodDetail=!state.ui.foodDetail;save();render();return}if(a==='food-done'){toast('Food logged');buzz();return}if(a==='move-tv'){let t=state.tasks.find(x=>x.id===e.dataset.id);if(t){t.done=true;t.rollovers=(t.rollovers||0)+1;save();render();toast('Moved to tomorrow');}return}if(a==='copy-quiet'){navigator.clipboard?.writeText($('#quietText').textContent);toast('Quiet-hours message copied');return}if(a==='save-settings'){let n=id=>Number($(id).value);let x={prep:n('#prep'),commute:n('#commute'),commuteBuffer:n('#cb'),desiredSleep:n('#sleep'),protectedBuffer:n('#pb')};if(Object.values(x).some(v=>Number.isNaN(v)||v<0)){toast('Use valid numbers.');return}state.settings=x;save();render();toast('Settings saved');return}if(a==='export'){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),u=URL.createObjectURL(b),x=document.createElement('a');x.href=u;x.download='workwell-backup.json';x.click();URL.revokeObjectURL(u);return}if(a==='import'){$('#file').click();$('#file').onchange=ev=>{let f=ev.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let q=JSON.parse(r.result);if(!q.settings||!q.shifts||!q.tasks)throw 0;state=q;save();render();toast('Backup restored')}catch{toast('Invalid backup file')}};r.readAsText(f)};return}if(a==='reset'){if(confirm('Erase WorkWell data on this device?')){state=defaults();save();render()}return}if(a==='quick-start'){$('#starttime').value=e.dataset.v;return}if(a==='save-shift'){let d=$('#workdate').value,st=$('#starttime').value,en=$('#endtime').value;if(!d||!st||!en){toast('Set date, start, and end time.');return}let start=new Date(`${d}T${st}`),end=new Date(`${d}T${en}`);if(end<=start)end.setDate(end.getDate()+1);let sh=nextShift()||state.shifts[0];Object.assign(sh,{start:ldt(start),end:ldt(end),location:$('#location').value.trim()||'Work location'});save();render();toast('Work time saved');return}}
function toggle(id){let t=state.tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;if(t.done){let actual=Math.max(1,Math.round((Date.now()-(t.startedAt||Date.now()))/60000));state.history.push({taskId:id,actual,at:new Date().toISOString()});}save();render();toast(t.done?`${t.title} done`:`${t.title} reopened`);buzz()}
function openShift(){let d=document.createElement('div');d.id='shiftPick';d.innerHTML=shiftPicker();document.body.append(d);d.querySelectorAll('[data-a]').forEach(e=>e.onclick=()=>{if(e.dataset.a==='close-shift'){d.remove();return}if(e.dataset.a==='quick-start'){$('#starttime',d).value=e.dataset.v;return}if(e.dataset.a==='save-shift'){let datev=$('#workdate',d).value,st=$('#starttime',d).value,en=$('#endtime',d).value;if(!datev||!st||!en){toast('Set date, start, and end time.');return}let start=new Date(`${datev}T${st}`),end=new Date(`${datev}T${en}`);if(end<=start)end.setDate(end.getDate()+1);let sh=nextShift()||state.shifts[0];Object.assign(sh,{start:ldt(start),end:ldt(end),location:$('#location',d).value.trim()||'Work location'});save();d.remove();render();toast('Work time saved')}})}
render();
