<!doctype html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111111">
<title>WorkWell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#111;
  --paper:#fff;
  --soft:#f4f4ef;
  --green:#148b41;
  --green-dark:#0b6630;
  --amber:#fff2c7;
  --blue:#edf7ff;
  --red:#a82222;
  --line:#111;
  --muted:#5b5b5b;
}
*{box-sizing:border-box}
html{
  background:var(--paper);
}
body{
  margin:0;
  background:var(--paper);
  color:var(--ink);
  font:600 17px/1.48 Inter,Arial,sans-serif;
}
button,input,select{
  font:inherit;
}
button{
  -webkit-tap-highlight-color:transparent;
}
.app{
  max-width:740px;
  margin:auto;
  padding:0 18px 115px;
}
/* HEADER */
.top{
  position:sticky;
  top:0;
  z-index:20;
  background:#fff;
  margin:0 -18px;
  padding:16px 18px 14px;
  border-bottom:4px solid var(--line);
}
.toprow{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}
.brand{
  font:700 32px/1 Fraunces,serif;
  letter-spacing:-.045em;
}
.sub{
  margin-top:6px;
  color:var(--muted);
  font-size:13px;
  font-weight:600;
}
.iconbtn{
  width:52px;
  height:52px;
  border:3px solid var(--line);
  border-radius:50%;
  background:#fff;
  cursor:pointer;
  font-size:22px;
  font-weight:800;
}
/* GENERAL */
.screen{
  padding-top:21px;
}
.eyebrow{
  font-size:12px;
  line-height:1.2;
  font-weight:800;
  letter-spacing:.14em;
  color:#555;
}
.title{
  margin:6px 0 11px;
  font:700 30px/1.08 Fraunces,serif;
  letter-spacing:-.04em;
}
.card{
  margin:0 0 18px;
  padding:20px;
  border:3px solid var(--line);
  border-radius:25px;
  background:#fff;
}
.card.soft{
  background:var(--soft);
}
.small{
  color:var(--muted);
  font-size:14px;
}
.button{
  min-height:56px;
  padding:10px 18px;
  border:3px solid var(--line);
  border-radius:999px;
  background:#fff;
  color:#111;
  cursor:pointer;
  font:800 16px Inter,sans-serif;
}
.button.primary{
  width:100%;
  margin-top:18px;
  background:#111;
  color:#fff;
}
.button.green{
  background:var(--green);
  color:#fff;
}
.button.warn{
  border-color:var(--red);
  color:var(--red);
}
.row{
  display:flex;
  align-items:center;
  flex-wrap:wrap;
  gap:9px;
}
.input,
.select{
  min-height:50px;
  padding:8px 11px;
  border:2px solid var(--line);
  border-radius:13px;
  background:#fff;
  color:#111;
  font:700 16px Inter,sans-serif;
}
.input.flex{
  flex:1;
  min-width:180px;
}
/* PRIORITY CARD */
.next{
  padding:21px;
  border:3px solid var(--line);
  border-radius:27px;
  background:var(--green);
  color:#fff;
  box-shadow:7px 7px 0 var(--line);
}
.next .eyebrow{
  color:#edfff2;
}
.tasktitle{
  margin:14px 0 4px;
  font:800 27px/1.15 Inter,sans-serif;
}
.reason{
  margin-top:16px;
  padding-top:14px;
  border-top:2px solid rgba(255,255,255,.58);
  font-size:15px;
}
.metrics{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:18px;
}
.metric{
  padding:10px;
  border:2px solid #111;
  border-radius:16px;
  background:#fff;
  color:#111;
}
.metric b{
  display:block;
  font-size:19px;
  line-height:1.15;
}
.metric span{
  display:block;
  margin-top:3px;
  color:#505050;
  font-size:12px;
}
.status{
  margin-top:15px;
  padding:13px 15px;
  border:2px solid var(--line);
  border-radius:16px;
  background:#f3f3ee;
  cursor:pointer;
  font-size:15px;
}
.notice{
  margin-top:13px;
  padding:12px 14px;
  border-left:6px solid #d69700;
  background:var(--amber);
  font-size:15px;
}
.info{
  margin-top:13px;
  padding:12px 14px;
  border-left:6px solid #2079ab;
  background:var(--blue);
  font-size:15px;
}
/* TIMELINE */
.timeline{
  display:grid;
  gap:10px;
  margin-top:14px;
}
.time-row{
  display:grid;
  grid-template-columns:105px 1fr;
  gap:12px;
}
.time-row b{
  font-variant-numeric:tabular-nums;
}
/* PLAN */
.summary{
  display:grid;
  grid-template-columns:1fr auto;
  padding:9px 0;
  border-bottom:1px solid #c7c7c2;
  font-size:16px;
}
.summary.total{
  margin-top:7px;
  padding-top:11px;
  border-top:3px solid #111;
  border-bottom:0;
  font-weight:800;
}
/* TASKS */
.group{
  margin:21px 0;
}
.grouphead{
  display:flex;
  justify-content:space-between;
  margin-bottom:8px;
  font-size:13px;
  font-weight:800;
  letter-spacing:.12em;
}
.task{
  display:grid;
  grid-template-columns:42px 1fr auto 31px;
  gap:9px;
  align-items:center;
  margin:8px 0;
  padding:9px;
  border:2px solid var(--line);
  border-radius:17px;
}
.task.done{
  opacity:.5;
}
.check{
  width:35px;
  height:35px;
  border:2px solid #111;
  border-radius:50%;
  background:#fff;
  cursor:pointer;
  font-size:18px;
  font-weight:800;
}
.task.done .check{
  background:var(--green);
  color:#fff;
}
.taskname{
  font-weight:800;
  line-height:1.2;
}
.taskmeta{
  margin-top:3px;
  color:#555;
  font-size:12px;
}
.tasktime{
  font-size:14px;
  font-weight:800;
}
.delete{
  border:0;
  background:transparent;
  color:#555;
  cursor:pointer;
  font-size:24px;
}
.addbox{
  margin-top:17px;
  padding:15px;
  border:3px dashed #111;
  border-radius:20px;
}
/* CHOICES */
.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin-top:12px;
}
.choice{
  min-height:46px;
  padding:8px 14px;
  border:2px solid #111;
  border-radius:999px;
  background:#fff;
  cursor:pointer;
  font:800 15px Inter,sans-serif;
}
.choice.selected{
  background:#111;
  color:#fff;
}
.choice.selected.green{
  border-color:var(--green);
  background:var(--green);
}
/* FOOD */
.food-card{
  margin:17px 0;
  padding:18px;
  border:3px solid #111;
  border-radius:23px;
  background:#effaf1;
}
.food-card h2{
  margin:8px 0;
  font:800 23px/1.18 Inter,sans-serif;
}
.food-list{
  margin:13px 0 0;
  padding:0;
  list-style:none;
}
.food-list li{
  padding:9px 0;
  border-bottom:1px solid #b5d5bd;
}
.food-list li:last-child{
  border-bottom:0;
}
/* BOTTOM NAV */
.bottom{
  position:fixed;
  right:0;
  bottom:0;
  left:0;
  z-index:20;
  border-top:4px solid #111;
  background:#fff;
}
.tabs{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  max-width:740px;
  margin:auto;
}
.tab{
  min-height:78px;
  border:0;
  border-right:2px solid #111;
  background:#fff;
  cursor:pointer;
  font:800 13px Inter,sans-serif;
  letter-spacing:.06em;
}
.tab:last-child{
  border-right:0;
}
.tab.active{
  background:#111;
  color:#fff;
}
/* MODAL */
.modalback{
  position:fixed;
  inset:0;
  z-index:40;
  display:flex;
  align-items:flex-end;
  background:rgba(0,0,0,.55);
}
.modal{
  width:min(740px,100%);
  max-height:92vh;
  margin:auto;
  padding:21px 18px 34px;
  overflow:auto;
  border:3px solid #111;
  border-bottom:0;
  border-radius:28px 28px 0 0;
  background:#fff;
}
.modalhead{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
}
.modal h2{
  margin:0;
  font:700 29px/1 Fraunces,serif;
}
.setting{
  padding:17px 0;
  border-bottom:2px solid #ddd;
}
.setting:last-child{
  border-bottom:0;
}
/* TOAST */
.toast{
  position:fixed;
  left:50%;
  bottom:96px;
  z-index:60;
  max-width:92%;
  padding:11px 17px;
  transform:translateX(-50%);
  border-radius:999px;
  background:#111;
  color:#fff;
  text-align:center;
  font-size:15px;
  font-weight:800;
}
.hidden{
  display:none!important;
}
/* MOBILE */
@media(max-width:490px){
  .brand{
    font-size:29px;
  }
  .title{
    font-size:27px;
  }
  .tasktitle{
    font-size:24px;
  }
  .metrics{
    grid-template-columns:1fr;
  }
  .task{
    grid-template-columns:39px 1fr auto 27px;
  }
  .time-row{
    grid-template-columns:91px 1fr;
  }
  .input.flex{
    flex-basis:100%;
  }
  .select{
    flex:1;
  }
}
</style>
</head>
<body>
<div id="root"></div>
<script>
(()=>{
"use strict";
/* =========================================================
   WORKWELL V5
   Local-first work / recovery planner
   ========================================================= */
const $=(s,r=document)=>r.querySelector(s);
const $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>{
  try{return crypto.randomUUID()}
  catch{return Date.now()+"-"+Math.random().toString(36).slice(2)}
};
const esc=s=>String(s??"").replace(/[&<>'"]/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  "'":"&#39;",
  '"':"&quot;"
}[c]));
const pad=n=>String(n).padStart(2,"0");
const ldt=d=>
  `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
const todayKey=()=>new Date().toDateString();
const tomorrow=(hour,minute=0)=>{
  const d=new Date();
  d.setDate(d.getDate()+1);
  d.setHours(hour,minute,0,0);
  return ldt(d);
};
const addMinutes=(date,n)=>{
  const d=new Date(date);
  d.setMinutes(d.getMinutes()+Number(n));
  return d;
};
const time=d=>new Date(d).toLocaleTimeString([],{
  hour:"numeric",
  minute:"2-digit"
});
const date=d=>new Date(d).toLocaleDateString([],{
  weekday:"long",
  month:"short",
  day:"numeric"
});
const duration=n=>{
  n=Math.max(0,Math.round(Number(n)||0));
  const h=Math.floor(n/60);
  const m=n%60;
  if(h)return m?`${h}h ${m}m`:`${h}h`;
  return `${m}m`;
};
/* =========================================================
   DEFAULT DATA
   ========================================================= */
function defaults(){
  return{
    version:5,
    settings:{
      desiredSleep:7.5,
      prep:35,
      commute:25,
      commuteBuffer:10,
      protectedBuffer:20
    },
    shifts:[
      {
        id:uid(),
        start:tomorrow(6,30),
        end:tomorrow(15),
        location:"Main work site"
      }
    ],
    tasks:[
      {
        id:uid(),
        title:"Pack work bag",
        estimate:10,
        category:"must",
        beforeLeave:true,
        done:false
      },
      {
        id:uid(),
        title:"Make lunch",
        estimate:10,
        category:"must",
        beforeLeave:true,
        done:false
      },
      {
        id:uid(),
        title:"Lay out clothes",
        estimate:5,
        category:"useful",
        beforeLeave:false,
        done:false
      },
      {
        id:uid(),
        title:"Watch an episode",
        estimate:42,
        category:"wait",
        beforeLeave:false,
        done:false
      }
    ],
    recovery:{
      energy:"okay",
      dayType:"normal",
      foodAccess:"standard",
      needs:{
        vegetables:false,
        fruit:false,
        protein:false,
        fiber:false,
        omega3:false,
        probiotic:false
      }
    },
    ui:{
      tab:"now",
      settings:false,
      explain:false,
      foodDetail:false
    },
    history:[]
  };
}
/* =========================================================
   STATE
   ========================================================= */
let state;
try{
  state=JSON.parse(localStorage.getItem("workwell_v5"))||defaults();
}catch{
  state=defaults();
}
if(
  !state.settings ||
  !Array.isArray(state.shifts) ||
  !Array.isArray(state.tasks)
){
  state=defaults();
}
function save(){
  try{
    localStorage.setItem("workwell_v5",JSON.stringify(state));
  }catch{
    toast("Could not save on this device.");
  }
}
/* =========================================================
   PLANNING ENGINE
   ========================================================= */
function nextShift(now=new Date()){
  return state.shifts
    .filter(s=>new Date(s.start)>now)
    .sort((a,b)=>new Date(a.start)-new Date(b.start))[0]||null;
}
function planning(){
  const shift=nextShift();
  if(!shift){
    return{shift:null};
  }
  const start=new Date(shift.start);
  const leave=addMinutes(
    start,
    -(Number(state.settings.commute)+
      Number(state.settings.commuteBuffer))
  );
  const wake=addMinutes(
    leave,
    -Number(state.settings.prep)
  );
  const bed=addMinutes(
    wake,
    -Number(state.settings.desiredSleep)*60
  );
  const available=Math.max(
    0,
    Math.floor((bed-new Date())/60000)
  );
  const active=state.tasks.filter(t=>
    !t.done &&
    t.skipUntil!==todayKey()
  );
  const total=category=>
    active
      .filter(t=>t.category===category)
      .reduce((sum,t)=>sum+Number(t.estimate),0);
  const must=total("must");
  const useful=total("useful");
  const wait=total("wait");
  return{
    shift,
    start,
    leave,
    wake,
    bed,
    available,
    active,
    must,
    useful,
    wait,
    planned:must+useful,
    buffer:available-must
  };
}
/* =========================================================
   PRIORITY ENGINE
   ========================================================= */
const categoryRank={
  must:0,
  useful:1,
  wait:2
};
function fits(t,p){
  if(t.category==="must")return true;
  if(state.recovery.energy==="drained"){
    return false;
  }
  const remaining=
    p.available-
    p.must-
    Number(state.settings.protectedBuffer);
  if(t.category==="useful"){
    return Number(t.estimate)<=remaining;
  }
  return Number(t.estimate)<=
    Math.max(0,remaining-p.useful);
}
function recommendation(p){
  if(!p.shift){
    return{
      kind:"setup",
      title:"Set your next work time",
      time:"1 minute",
      why:"WorkWell needs a shift time before it can calculate your leaving time, wake time, and bedtime.",
      action:"Set work time"
    };
  }
  if(p.available<=0){
    return{
      kind:"wind",
      title:"Start winding down",
      time:"Now",
      why:"Your target bedtime has arrived. Protect sleep and let optional tasks wait.",
      action:"Begin wind-down"
    };
  }
  const must=p.active
    .filter(t=>t.category==="must")
    .sort((a,b)=>a.estimate-b.estimate);
  let task=must[0];
  if(!task){
    task=p.active
      .filter(t=>fits(t,p))
      .sort((a,b)=>
        categoryRank[a.category]-categoryRank[b.category]||
        a.estimate-b.estimate
      )[0];
  }
  if(!task){
    return{
      kind:"rest",
      title:"You are done for tonight",
      time:`${duration(p.available)} left`,
      why:"Everything remaining is optional or does not fit without cutting into protected time.",
      action:"Rest"
    };
  }
  let why;
  if(task.beforeLeave){
    why="This needs to happen before you leave and protects tomorrow morning.";
  }else{
    why="This is the smallest useful task that fits without taking time from sleep.";
  }
  if(state.recovery.energy==="drained"){
    why="You marked yourself as drained. Finish the essential task, then let optional work wait.";
  }
  return{
    kind:"task",
    title:task.title,
    time:duration(task.estimate),
    why,
    action:"Mark done",
    task
  };
}
/* =========================================================
   FOOD ENGINE
   ========================================================= */
function foodPlan(p){
  const needs=state.recovery.needs;
  const near=p.available<=45;
  let base=[];
  let title;
  let why;
  if(near){
    title="Light food, then wind down";
    why=
      `Bedtime is in ${duration(p.available)}. `+
      "Choose a modest, familiar option rather than a large heavy meal.";
    base=[
      "Plain yogurt or kefir + banana + walnuts",
      "Oatmeal with milk or fortified soy milk + berries",
      "Whole-grain toast + peanut butter + fruit"
    ];
  }else{
    const active=
      state.recovery.dayType==="active"||
      state.recovery.dayType==="workout";
    if(active){
      title="Recovery meal: carbohydrate + protein";
      base=[
        "Salmon or sardines + brown rice + spinach",
        "Beans or lentils + rice + peppers + olive oil",
        "Chicken or tofu + sweet potato + broccoli"
      ];
    }else if(state.recovery.energy==="drained"){
      title="Simple recovery meal";
      base=[
        "Eggs + whole-grain toast + fruit",
        "Greek yogurt + oats + berries + nuts",
        "Bean soup + whole-grain bread + fruit"
      ];
    }else{
      title="Simple balanced meal";
      base=[
        "Beans or lentils + rice + vegetables",
        "Chicken or tofu + whole grain + vegetables",
        "Eggs + whole-grain toast + fruit"
      ];
    }
    why=
      "Food first: use familiar whole or minimally processed foods. "+
      "The goal is a simple meal that can contribute protein, fiber, "+
      "omega-3 fats, and micronutrients."
  }
  const upgrades=[];
  if(!needs.vegetables)
    upgrades.push("Add a colorful vegetable.");
  if(!needs.fruit)
    upgrades.push("Add fruit such as berries, orange, banana, apple, or kiwi.");
  if(!needs.protein)
    upgrades.push("Add beans, lentils, eggs, yogurt, fish, chicken, tofu, or fortified soy food.");
  if(!needs.fiber)
    upgrades.push("Choose oats, beans, lentils, whole grains, fruit, or vegetables.");
  if(!needs.omega3)
    upgrades.push("For omega-3 food, choose salmon, sardines, trout, chia, flax, or walnuts.");
  if(!needs.probiotic)
    upgrades.push("For probiotic food, choose plain yogurt, kefir, or a fermented food you tolerate.");
  if(state.recovery.foodAccess==="limited")
    upgrades.push("Limited-access option: canned beans or fish, frozen vegetables, oats, peanut butter, yogurt, and fruit.");
  if(state.recovery.foodAccess==="none")
    upgrades.push("No food available: make the next meal simple when food becomes available.");
  return{
    title,
    why,
    base,
    upgrades
  };
}
/* =========================================================
   UI HELPERS
   ========================================================= */
let toastTimer;
function toast(message){
  clearTimeout(toastTimer);
  let el=$(".toast");
  if(!el){
    el=document.createElement("div");
    el.className="toast";
    document.body.append(el);
  }
  el.textContent=message;
  el.classList.remove("hidden");
  toastTimer=setTimeout(()=>{
    el.classList.add("hidden");
  },2400);
}
function buzz(){
  try{
    navigator.vibrate?.(16);
  }catch{}
}
/* =========================================================
   RENDER
   ========================================================= */
function render(){
  const p=planning();
  let content;
  if(state.ui.tab==="now"){
    content=renderNow(p);
  }
  if(state.ui.tab==="plan"){
    content=renderPlan(p);
  }
  if(state.ui.tab==="recovery"){
    content=renderRecovery(p);
  }
  $("#root").innerHTML=`
    <div class="app">
      <header class="top">
        <div class="toprow">
          <div>
            <div class="brand">WorkWell</div>
            <div class="sub">
              Work. Recover. Sleep. Repeat.
            </div>
          </div>
          <button
            class="iconbtn"
            data-action="settings"
            aria-label="Settings">
            ⚙
          </button>
        </div>
      </header>
      <main class="screen">
        ${content}
      </main>
    </div>
    <nav class="bottom">
      <div class="tabs">
        <button
          class="tab ${state.ui.tab==="now"?"active":""}"
          data-tab="now">
          NOW
        </button>
        <button
          class="tab ${state.ui.tab==="plan"?"active":""}"
          data-tab="plan">
          PLAN
        </button>
        <button
          class="tab ${state.ui.tab==="recovery"?"active":""}"
          data-tab="recovery">
          FOOD + RECOVERY
        </button>
      </div>
    </nav>
    ${state.ui.settings?renderSettings():""}
  `;
  bind();
}
/* =========================================================
   NOW
   ========================================================= */
function renderNow(p){
  if(!p.shift){
    return`
      <section class="card">
        <div class="eyebrow">START HERE</div>
        <h1 class="title">
          Set your next work time
        </h1>
        <p>
          WorkWell will calculate when to leave,
          wake up, and go to bed.
        </p>
        <button
          class="button green"
          data-action="shift">
          SET WORK TIME
        </button>
      </section>
    `;
  }
  const r=recommendation(p);
  const tv=p.active.find(t=>

function renderGroup(category,label){
  const tasks=state.tasks
    .filter(t=>t.category===category)
    .sort((a,b)=>
      Number(a.done)-Number(b.done)||
      Number(a.estimate)-Number(b.estimate)
    );
  const total=tasks
    .filter(t=>
      !t.done &&
      t.skipUntil!==todayKey()
    )
    .reduce((sum,t)=>sum+Number(t.estimate),0);
  return`
    <div class="group">
      <div class="grouphead">
        <span>${label}</span>
        <span>${duration(total)}</span>
      </div>
      ${
        tasks.length
        ?tasks.map(t=>`
          <div class="task ${t.done?"done":""}">
            <button
              class="check"
              data-action="toggle"
              data-id="${t.id}">

              <div class="taskmeta">

                  t.skipUntil===todayKey()
                  ?" • moved to tomorrow"
                  :""
                }

            </div>
            <div class="tasktime">
              ${duration(t.estimate)}
            </div>
            <button
              class="delete"
              data-action="delete"
              data-id="${t.id}">
              ×
            </button>
          </div>
        `).join("")
        :`<div class="small">Nothing here.</div>`
      }
    </div>
  `;
}

/* =========================================================
   EVENT BINDING
   ========================================================= */
function bind(){
  $$("[data-tab]").forEach(button=>{
    button.onclick=()=>{
      state.ui.tab=button.dataset.tab;
      save();
      render();
    };
  });
  $$("[data-action]").forEach(button=>{
    button.onclick=()=>handle(button.dataset.action,button);
  });
}
/* =========================================================
   ACTIONS
   ========================================================= */
function handle(action,el){
  const p=planning();
  switch(action){
    case"settings":
      state.ui.settings=!state.ui.settings;
      save();
      render();
      break;
    case"shift":
      openShift();
      break;
    case"explain":
      state.ui.explain=!state.ui.explain;
      save();
      render();
      break;
    case"complete":{
      const r=recommendation(p);
      if(r.kind==="task"){
        toggleTask(r.task.id);
      }else if(r.kind==="setup"){
        openShift();
      }else{
        toast(r.action);
        buzz();
      }
      break;
    }
    case"toggle":
      toggleTask(el.dataset.id);
      break;
    case"delete":
      state.tasks=
        state.tasks.filter(t=>t.id!==el.dataset.id);
      save();
      render();
      break;
    case"add":
      addTask();
      break;
    case"energy":
      state.recovery.energy=el.dataset.value;
      save();
      render();
      break;
    case"day":
      state.recovery.dayType=el.dataset.value;
      save();
      render();
      break;
    case"need":{
      const k=el.dataset.value;
      state.recovery.needs[k]=
        !state.recovery.needs[k];
      save();
      render();
      break;
    }
    case"access":
      state.recovery.foodAccess=el.dataset.value;
      save();
      render();
      break;
    case"food-detail":
      state.ui.foodDetail=!state.ui.foodDetail;
      save();
      render();
      break;
    case"food-done":
      toast("Food logged");
      buzz();
      break;
    case"move-tv":
      moveTomorrow(el.dataset.id);
      break;
    case"copy-quiet":
      copyQuiet();
      break;
    case"save-settings":
      saveSettings();
      break;
    case"export":
      exportData();
      break;
    case"import":
      $("#file")?.click();
      break;
    case"reset":
      resetData();
      break;
  }
}
/* =========================================================
   TASKS
   ========================================================= */
function addTask(){
  const title=$("#taskname")?.value.trim();
  const estimate=Number($("#taskmins")?.value);
  const category=$("#taskcat")?.value;
  if(!title||!estimate){
    toast("Enter a task and minutes.");
    return;
  }
  state.tasks.push({
    id:uid(),
    title,
    estimate,
    category,
    beforeLeave:category==="must",
    done:false
  });
  save();
  render();
  toast("Task added");
}
function toggleTask(id){
  const task=state.tasks.find(t=>t.id===id);
  if(!task)return;
  task.done=!task.done;
  if(task.done){
    state.history.push({
      taskId:id,
      actual:null,
      at:new Date().toISOString()
    });
  }
  save();
  render();
  toast(
    task.done
    ?`${task.title} done`
    :`${task.title} reopened`
  );
  buzz();
}
function moveTomorrow(id){
  const task=state.tasks.find(t=>t.id===id);
  if(!task)return;
  task.skipUntil=todayKey();
  task.rollovers=(task.rollovers||0)+1;
  save();
  render();
  toast("Moved to tomorrow");
}
/* =========================================================
   SETTINGS
   ========================================================= */
function saveSettings(){
  const values={
    prep:Number($("#prep")?.value),
    commute:Number($("#commute")?.value),
    commuteBuffer:Number($("#cb")?.value),
    desiredSleep:Number($("#sleep")?.value),
    protectedBuffer:Number($("#pb")?.value)
  };
  if(
    Object.values(values).some(v=>
      Number.isNaN(v)||v<0
    )
  ){
    toast("Use valid numbers.");
    return;
  }
  state.settings=values;
  save();
  render();
  toast("Settings saved");
}
/* =========================================================
   EXPORT / IMPORT
   ========================================================= */
function exportData(){
  const blob=new Blob(
    [JSON.stringify(state,null,2)],
    {type:"application/json"}
  );
  const url=URL.createObjectURL(blob);
  const link=document.createElement("a");
  link.href=url;
  link.download="workwell-backup.json";
  document.body.append(link);
  link.click();
  link.remove();
  setTimeout(
    ()=>URL.revokeObjectURL(url),
    500
  );
}
function importData(){
  const input=$("#file");
  if(!input)return;
  input.onchange=event=>{
    const file=event.target.files?.[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        const imported=
          JSON.parse(reader.result);
        if(
          !imported.settings||
          !imported.shifts||
          !imported.tasks
        ){
          throw new Error();
        }
        state=imported;
        save();
        render();
        toast("Backup restored");
      }catch{
        toast("Invalid backup file");
      }
    };
    reader.readAsText(file);
  };
  input.click();
}
function resetData(){
  if(!confirm(
    "Erase WorkWell data on this device?"
  ))return;
  state=defaults();
  save();
  render();
  toast("WorkWell reset");
}
/* =========================================================
   CLIPBOARD
   ========================================================= */
async function copyQuiet(){
  const text=$("#quietText")?.textContent.trim();
  if(!text)return;
  try{
    await navigator.clipboard.writeText(text);
    toast("Quiet-hours message copied");
  }catch{
    toast("Could not copy message");
  }
}
/* =========================================================
   SHIFT MODAL
   ========================================================= */
function openShift(){
  const wrapper=document.createElement("div");
  wrapper.innerHTML=shiftPicker();
  document.body.append(wrapper);
  const modal=$("#shiftModal",wrapper);
  $$("[data-shift-action]",wrapper)
    .forEach(button=>{
      button.onclick=()=>{
        const action=
          button.dataset.shiftAction;
        if(action==="close"){
          wrapper.remove();
          return;
        }
        if(action==="quick"){
          $("#starttime",wrapper).value=
            button.dataset.value;
          return;
        }
        if(action==="save"){
          saveShift(wrapper);
        }
      };
    });
}
function saveShift(wrapper){
  const dateValue=
    $("#workdate",wrapper)?.value;
  const startValue=
    $("#starttime",wrapper)?.value;
  const endValue=
    $("#endtime",wrapper)?.value;
  if(
    !dateValue||
    !startValue||
    !endValue
  ){
    toast("Set date, start, and end time.");
    return;
  }
  const start=
    new Date(`${dateValue}T${startValue}`);
  const end=
    new Date(`${dateValue}T${endValue}`);
  if(end<=start){
    end.setDate(end.getDate()+1);
  }
  let shift=
    nextShift()||
    state.shifts[0];
  if(!shift){
    shift={
      id:uid()
    };
    state.shifts.push(shift);
  }
  Object.assign(shift,{
    start:ldt(start),
    end:ldt(end),
    location:
      $("#location",wrapper)?.value.trim()||
      "Work location"
  });
  save();
  wrapper.remove();
  render();
  toast("Work time saved");
}
/* =========================================================
   INITIALIZE
   ========================================================= */
render();
})();
</script>
</body>
</html>
